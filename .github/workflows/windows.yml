name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B out/build/ci -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build out/build/ci --config Release --parallel 4
      - name: Core, model, receiver and protocol tests
        run: ctest --test-dir out/build/ci -C Release -R "^(core|control_protocol|desktop_model|receiver_lifecycle)$" --output-on-failure
